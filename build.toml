[general]
name = "disentangled-flash"
# Version 0 is reserved for alpha/beta kernels and is exempt from the API
# compatibility guarantee. Bump to 1 once backward/training support lands and
# the supported-GPU matrix is stable.
version = 0
edition = 5
license = "Apache-2.0"
upstream = "git+https://github.com/delyan-boychev/disentangled-flash.git"
backends = ["cuda"]

[general.hub]
repo-id = "delyanboychev/disentangled-flash"

# Pure-Triton kernel: no compiled extension, so a single noarch build variant
# covers every supported Torch/CUDA combination. `json` ships the bundled
# tuning profiles under profiles/.
[torch-noarch]
pyext = [
    "py",
    "pyi",
    "json",
]

[kernel]
