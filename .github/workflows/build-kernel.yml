# Builds the kernel with Nix on a GitHub-hosted runner and uploads it to the Hub.
#
# kernel-builder is a Nix tool and installing Nix needs root, which is often
# unavailable on shared GPU boxes. GitHub's runners give us root, and this
# repository is public, so Actions minutes are free. The kernel is pure Triton
# (torch-noarch), so the build needs no GPU.
#
# HF Jobs is the other documented route, but it is pay-as-you-go and requires a
# positive prepaid credit balance.
#
# Requires the repository secret HF_TOKEN, an HF access token with *write*
# access to the target Hub repo. Uploading is free; no `job.write` and no
# credits are needed.
name: Build Kernel

on:
  push:
    branches: [main]
    paths:
      - "torch-ext/**"
      - build.toml
      - flake.nix
      - flake.lock
      - .github/workflows/build-kernel.yml
  workflow_dispatch:

concurrency:
  group: build-kernel-${{ github.ref }}
  # Never cancel a build in flight. This workflow uploads to the Hub and takes
  # several minutes; cancelling it on every push means it never finishes.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Runners start with ~14 GB free; Nix closures for every supported Torch
      # version need considerably more.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Without the Hugging Face binary cache, Nix rebuilds every supported
      # PyTorch version from source. This is not optional in practice.
      - name: Use the Hugging Face binary cache
        uses: cachix/cachix-action@v17
        with:
          name: huggingface
          skipPush: true

      - name: Validate build.toml
        run: nix run github:huggingface/kernels#kernel-builder -- check-config .

      # Split from the upload so a publish failure still leaves us a build to
      # download and verify. Publishing needs kernel-creation access on the
      # owning account, which is granted separately.
      - name: Build
        run: |
          nix run github:huggingface/kernels#kernel-builder -- build-and-copy . -L

      - name: Archive the build
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: build/
          if-no-files-found: error
          retention-days: 14

      - name: Upload to the Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          nix run github:huggingface/kernels#kernel-builder -- upload . \
            --repo-id delyanboychev/disentangled-flash \
            --output-json upload.json

      - name: Show the uploaded revision
        if: always()
        run: |
          if [ -f upload.json ]; then
            cat upload.json
          fi

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-metadata
          path: upload.json
          if-no-files-found: ignore
